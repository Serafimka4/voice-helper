[project]
name = "voice-helper"
version = "0.1.0"
description = "Голосовой ассистент регистратуры поликлиники — текстовое ядро"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.14.0",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
